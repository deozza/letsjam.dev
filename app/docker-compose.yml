services:
  website:
    # image: node:26
    # volumes:
    #   - ./:/app
    # working_dir: /app
    # tty: true
    # ports:
    #   - 5173:5173
    #   - 4173:4173
    build:
      context: .
    ports:
      - 3000:3000
    container_name: website
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
      - FOWNER
      - SETGID
      - SETUID
    env_file: .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
